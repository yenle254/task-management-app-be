name: Backend CI

on:
  push:
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend-ci:
    name: Backend CI
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        # A failed command must remain failed even when output is piped to tee.
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked dependencies
        run: |
          mkdir -p report/logs
          npm ci --ignore-scripts --no-audit --no-fund 2>&1 | tee report/logs/ci-install.log

      - name: Jest and coverage gate
        run: npm run test:ci 2>&1 | tee report/logs/ci-jest.log

      - name: Build production image
        run: docker build --progress=plain -t hr-task-api:ci . 2>&1 | tee report/logs/ci-build.log

      - name: Smoke test production container
        run: npm run test:docker -- hr-task-api:ci 2>&1 | tee report/logs/ci-container.log

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backend-coverage-${{ github.run_id }}-${{ github.run_attempt }}
          path: coverage/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload verification logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backend-ci-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: report/logs/ci-*.log
          if-no-files-found: warn
          retention-days: 14
